<body class="ad">
<noscript><p class="ad-nojs">El Panel Administrativo necesita JavaScript activado.</p></noscript>

<!-- Pantalla de acceso -->
<div class="gate" id="gate" hidden>
  <div class="gate__theme" data-theme-slot></div>
  <div class="gate__card">
    <div class="gate__brand"><img src="../assets/logo/logo.png" alt="" width="64" height="59"><div><b>Caldos Constitución</b><span>Panel Administrativo</span></div></div>
    <div id="gate-body"></div>
  </div>
  <p class="gate__foot"><a href="../inicio/inicio.html">← Volver al sitio</a></p>
</div>

<!-- Aplicación -->
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Navegación del panel">
    <div class="side__brand"><img src="../assets/logo/logo.png" alt="" width="40" height="37"><div><b>Caldos</b><span>Panel</span></div></div>
    <nav class="side__nav" id="nav"></nav>
    <div class="side__me" id="me"></div>
  </aside>
  <div class="side-scrim" id="side-scrim"></div>
  <div class="main">
    <header class="top">
      <button class="top__menu" id="menu-btn" type="button" aria-label="Abrir navegación" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <h1 class="top__t" id="view-title">Resumen</h1>
      <div class="top__acts" id="top-acts"></div>
      <div class="top__end">
        <span class="top__live" id="live" title="Conectado en tiempo real"><i></i><span>En vivo</span></span>
        <span data-theme-slot></span>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="boot" id="boot"><span class="boot__spin"></span><p>Cargando panel…</p></div>
